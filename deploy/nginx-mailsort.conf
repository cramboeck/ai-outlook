# MailSort vhost-Snippet für ramboflow-nginx
#
# Einfügen in /home/timetracking_app/timetracking_app/nginx/nginx.production.conf
# innerhalb des http { } Blocks, direkt neben den vorhandenen server { … }
# Blöcken für app.ramboeck.it und docs.ramboeck.it.
#
# Nach dem Einfügen:
#   sudo docker exec ramboflow-nginx nginx -t          # Config-Check
#   sudo docker exec ramboflow-nginx nginx -s reload   # Live neu laden
#
# Voraussetzung: MailSort-Container laufen und sind im Docker-Netz
# `timetracking_app_ramboflow-network` erreichbar (docker-compose.mailsort.yml
# joint das Netz per external: true, siehe dort).
#
# Domain unten (mail.ramboeck.it) durch die tatsächliche Subdomain ersetzen.

# ---- HTTP → HTTPS Redirect + ACME-Challenge ----
server {
    listen 80;
    listen [::]:80;
    server_name mail.ramboeck.it;

    # Certbot-Webroot für Let's Encrypt Renewals (nutzt gleiches Volume
    # wie ramboflow, siehe docker-compose vom timetracking_app-Stack).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.ramboeck.it;

    # Let's Encrypt Zertifikate (vom ramboflow-certbot Container verwaltet).
    ssl_certificate     /etc/letsencrypt/live/mail.ramboeck.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.ramboeck.it/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mail.ramboeck.it/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MailSortSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Hardening
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload-Cap — Backend akzeptiert 25 MB für Attachment-Forwarding.
    client_max_body_size 30M;

    # Timeouts — Copilot-Retrieval + Azure-OpenAI-Calls können dauern.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # ---- API → mailsort-backend (Container-DNS im shared Docker-Netz) ----
    location /api/ {
        proxy_pass http://mailsort-backend:7071;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # ---- Alles andere → mailsort-frontend (nginx im Container) ----
    location / {
        proxy_pass http://mailsort-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    access_log /var/log/nginx/mailsort.access.log main;
    error_log  /var/log/nginx/mailsort.error.log  warn;
}
