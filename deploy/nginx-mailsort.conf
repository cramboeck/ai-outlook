# MailSort — host-side nginx snippet
#
# Copy this file to /etc/nginx/sites-available/mailsort.conf on the
# Hetzner box, symlink to sites-enabled/, then:
#
#   sudo certbot --nginx -d mailsort.example.com
#   sudo systemctl reload nginx
#
# The certbot run will inject the SSL certificate paths + rewrite
# the http → https redirect automatically.
#
# Replace mailsort.example.com with your actual domain everywhere below.
# Replace 17071 / 17080 if you changed BACKEND_HOST_PORT / FRONTEND_HOST_PORT
# in .env.prod.

# HTTP → HTTPS redirect (certbot will manage this after --nginx run)
server {
    listen 80;
    listen [::]:80;
    server_name mailsort.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mailsort.example.com;

    # ssl_certificate + ssl_certificate_key get injected by certbot --nginx
    # If you use another cert source, add them manually here.

    # Basic hardening
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload cap — MailSort backend accepts 25 MB for attachment forwarding.
    client_max_body_size 30M;

    # Timeouts — Copilot retrieval + Azure OpenAI can take a while.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # ---- API → backend container ----
    location /api/ {
        proxy_pass http://127.0.0.1:17071;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # ---- Everything else → frontend container (SPA) ----
    location / {
        proxy_pass http://127.0.0.1:17080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Optional access + error logs per-app (recommended)
    access_log /var/log/nginx/mailsort.access.log;
    error_log  /var/log/nginx/mailsort.error.log warn;
}
