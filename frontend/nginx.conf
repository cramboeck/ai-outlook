# In-container nginx (for the frontend image itself).
# Serves the Vite build with SPA-fallback + sensible caching.
# The public-facing TLS termination is done by the host-side nginx one
# level above, which reverse-proxies to this container.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text-y responses.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/javascript image/svg+xml application/wasm;
  gzip_min_length 1024;

  # Long-cache hashed Vite assets. index.html stays no-cache so new
  # deployments propagate immediately.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # SPA fallback: any unknown route serves index.html so React Router
  # can handle it client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Basic security headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
