# PostPilot Local Development Stack
# Run: docker-compose up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postpilot-db
    environment:
      POSTGRES_USER: postpilot
      POSTGRES_PASSWORD: postpilot_dev_123
      POSTGRES_DB: postpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgAdmin (optional - for DB management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: postpilot-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@postpilot.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
